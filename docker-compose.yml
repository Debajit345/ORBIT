services:
  postgres:
    image: postgres:17
    container_name: orbit-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_password
      POSTGRES_DB: orbit

    ports:
      - "5432:5432"

    volumes:
      - orbit_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  orbit_postgres_data: